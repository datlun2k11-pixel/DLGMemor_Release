name: Build DLGMemor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Debug - List all files
      run: |
        echo "=== DANH SÁCH FILE TRONG REPO ==="
        ls -R

    - name: Find Project and Build
      run: |
        # Tự tìm file .xcodeproj hoặc .xcworkspace
        PROJ=$(find . -maxdepth 2 -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
        
        if [ -z "$PROJ" ]; then
          echo "❌ Đéo tìm thấy file project nào hết bro ơi!"
          exit 1
        fi
        
        echo "FOUND PROJECT: $PROJ"
        
        # Kiểm tra là workspace hay xcodeproj để build
        if [[ "$PROJ" == *.xcworkspace ]]; then
          xcodebuild -workspace "$PROJ" -scheme DLGMemor -configuration Release -sdk iphoneos BUILD_DIR=build CODE_SIGNING_ALLOWED=NO
        else
          xcodebuild -project "$PROJ" -scheme DLGMemor -configuration Release -sdk iphoneos BUILD_DIR=build CODE_SIGNING_ALLOWED=NO
        fi

    - name: Zip Build Output
      run: |
        cd build/Release-iphoneos
        zip -r DLGMemor.zip DLGMemor.framework

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DLGMemor-Build
        path: build/Release-iphoneos/DLGMemor.zip
