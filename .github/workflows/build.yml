name: Build DLGMemor

on:
  workflow_dispatch: # Cho phép bấm nút Build thủ công bất cứ lúc nào

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Build Framework
      run: |
        xcodebuild -project DLGMemor/DLGMemor.xcodeproj \
                   -scheme DLGMemor \
                   -configuration Release \
                   -sdk iphoneos \
                   BUILD_DIR=build \
                   CODE_SIGNING_ALLOWED=NO

    - name: Zip Build Output
      run: |
        cd build/Release-iphoneos
        zip -r DLGMemor.zip DLGMemor.framework

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DLGMemor-Build
        path: build/Release-iphoneos/DLGMemor.zip
