name: Build DLGMemor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Framework via xcodeproj
      run: |
        xcodebuild -project DLGMemor/DLGMemor/DLGMemor.xcodeproj \
                   -scheme DLGMemor \
                   -configuration Release \
                   -sdk iphoneos \
                   BUILD_DIR=build \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES

    - name: Zip Build Output
      run: |
        cd build/Release-iphoneos
        zip -r DLGMemor.zip DLGMemor.framework || zip -r DLGMemor.zip *.dylib || echo "No framework found"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DLGMemor-Build
        path: build/Release-iphoneos/DLGMemor.zip
